name: Validate Skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run skills validator
        run: ./scripts/validate-skills.sh

      - name: Run validator test suite
        run: ./tests/validate-skills.test.sh

      - name: Install adapter dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep shellcheck

      - name: Shellcheck
        run: shellcheck -x scripts/validate-skills.sh scripts/adapters/*.sh tests/*.sh

      - name: Run adapters test suite
        run: ./tests/adapters.test.sh
